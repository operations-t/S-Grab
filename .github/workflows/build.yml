name: Build S-Grab APK

# Runs on every push to main and can be started by hand from the Actions tab.
# Pushing a tag like v1.0.0 also publishes a GitHub Release, which the app's
# built-in updater reads.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned: ubuntu-24.04 ships with the Android SDK preinstalled.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi

      # The app icon comes from branding/app-icon.png - replace that picture to change it.
      - name: Build app icons from branding/app-icon.png
        run: |
          command -v convert >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q imagemagick)
          bash branding/make-icons.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Load signing key
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > app/sgrab-release.jks
            {
              echo "storeFile=sgrab-release.jks"
              echo "storePassword=$KEY_STORE_PASSWORD"
              echo "keyAlias=$ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No SIGNING_KEY secret - building a debug APK instead. Add the 4 signing secrets to get release builds that update in place."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APKs
        if: steps.signing.outputs.signed == 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleGenericRelease --no-daemon
          mkdir -p out && cp app/build/outputs/apk/generic/release/*.apk out/

      - name: Build debug APK (no signing key)
        if: steps.signing.outputs.signed != 'true'
        run: |
          chmod +x gradlew
          ./gradlew assembleGenericDebug --no-daemon
          mkdir -p out && cp app/build/outputs/apk/generic/debug/*.apk out/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: S-Grab-apks
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      # Signed builds from main publish (or refresh) the release for the
      # current app version, e.g. v1.0.0. Bump the version in
      # buildSrc/src/main/kotlin/Version.kt to start a new release.
      - name: Read app version
        id: version
        if: steps.signing.outputs.signed == 'true'
        run: |
          V=$(ls out/*.apk | head -1 | sed -E 's#.*/S-Grab-([0-9]+\.[0-9]+\.[0-9]+[^-]*(-[a-z]+\.[0-9]+)?)-.*#\1#')
          echo "Version: $V"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.signing.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: S-Grab ${{ steps.version.outputs.tag }}
          body: |
            Install the **arm64-v8a** APK on most phones, or **universal** if unsure.
            Built from ${{ github.sha }}.
          files: out/*.apk
          overwrite_files: true
